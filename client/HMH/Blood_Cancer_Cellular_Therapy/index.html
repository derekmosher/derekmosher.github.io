<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>HMH Blood Cancer Cellular Therapy | Banner Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            background: #0f1938;
            color: #fff;
            font-family: "Poppins", sans-serif;
            padding: 36px 16px 56px;
        }
        h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; text-align: center; }
        p.sub { font-size: 13px; font-weight: 400; margin: 0 0 32px; opacity: .7; text-align: center; }
        #sizes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 44px 36px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .item { width: 300px; display: flex; flex-direction: column; align-items: center; }
        .item h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; letter-spacing: .04em; }
        .item p.copy { font-size: 12px; line-height: 1.45; font-weight: 400; margin: 0 0 14px; opacity: .65; text-align: center; min-height: 36px; }
        .thumb {
            width: 300px; height: 220px;
            background: rgba(255,255,255,.06);
            box-shadow: 0 10px 40px rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: 700; letter-spacing: .02em;
        }
        .open {
            display: inline-block;
            margin-top: 22px;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            color: #0f1938;
            background: #5dd146;
            padding: 11px 0;
            width: 112px;
            transition: transform .25s ease;
        }
        .open:hover { transform: scale(1.06); }
        .open:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <h1>Blood Cancer Cellular Therapy</h1>
    <p class="sub">Banner Review &middot; HTML5</p>

    <div id="sizes">
        <div class="item">
            <h2>300x600</h2>
            <p class="copy">RTB1, RTB2, RTB3, RTB3 Pic</p>
            <div class="thumb">300x600</div>
            <a class="open" href="300x600/index.html">View</a>
        </div>
        <div class="item">
            <h2>320x600</h2>
            <p class="copy">RTB3, RTB3 Pic</p>
            <div class="thumb">320x600</div>
            <a class="open" href="320x600/index.html">View</a>
        </div>
    </div>

</html>
