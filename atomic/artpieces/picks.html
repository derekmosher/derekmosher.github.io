<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My picks | Atomic Motors Art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecee; --card:#fff; --ink:#14202b; --muted:#5a6772; --line:#cdd3d8; --accent:#c41222; --accent-ink:#fff; --photo:#dde2e6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --card:#18222b; --ink:#eef1f3; --muted:#9aa7b2; --line:#2c3a46; --accent:#ff4a58; --accent-ink:#14202b; --photo:#223039; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.brand a{color:inherit;text-decoration:none}.brand b{color:var(--accent)}
.tn{display:flex;gap:14px}.tn a[aria-current="page"]{color:var(--ink);border-bottom:2px solid var(--accent)}
.brand a:focus-visible,.chips button:focus-visible,.item:focus-visible,#q:focus-visible,.shop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,8vw,34px);line-height:1.1}
.sub{margin:0;color:var(--muted)}
#q{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips button{flex:0 0 auto;font:600 14px var(--body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:300px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.thumb{aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb span{color:var(--muted);font-size:13px}
.meta{padding:8px 10px 10px;border-top:1px solid var(--line)}
.meta .sku{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.05em;line-height:1.1}
.meta .t{font-size:14px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .w{font-size:12px;color:var(--muted);margin-top:2px}
.meta .p{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.acts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.hs input{width:20px;height:20px;accent-color:var(--accent)}
.msg{padding:24px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:6px}
.shop{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px}
.foot{font-size:13px;color:var(--muted)}
</style>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="home.html"><b>Atomic</b> Motors</a><span class="tn"><a href="home.html" data-i18n="nav_all"></a><a href="map.html" data-i18n="nav_map"></a><a href="picks.html" aria-current="page"><span data-i18n="nav_picks"></span> <span id="pickCount"></span></a><select id="lang"></select></span></div>
  <h1 data-i18n="picks_title"></h1>
  <p class="sub" id="count"></p>
  <div class="msg" id="shared" hidden></div>
  <div class="acts2" id="acts" hidden><button type="button" class="act" id="shareBtn" data-i18n="picks_share"></button><button type="button" class="act" id="saveAll" data-i18n="picks_saveall" hidden></button><button type="button" class="act" id="clear" data-i18n="picks_clear"></button></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" hidden></div>
  <div class="foot" id="note" data-i18n="picks_note"></div>
  <a class="shop" href="home.html" data-i18n="home_title"></a>
  <a class="shop" href="https://dratomics.com/" target="_blank" rel="noopener" data-i18n="shop"></a>
</div>
<script src="common.js"></script>
<script>
(function(){
  function shrink(){var x=window.innerWidth;document.body.style.zoom=(x>0&&x<300)?(x/340):""}
  shrink();window.addEventListener("resize",shrink);
  var T=AM.T,grid=document.getElementById("grid"),msg=document.getElementById("msg"),count=document.getElementById("count"),
      acts=document.getElementById("acts"),sharedBox=document.getElementById("shared"),saveAll=document.getElementById("saveAll"),
      clearBtn=document.getElementById("clear"),shareBtn=document.getElementById("shareBtn"),note=document.getElementById("note");
  var sp=new URLSearchParams(location.search).get("p"),sharedList=sp?sp.split(",").map(function(x){return x.trim().toUpperCase()}).filter(function(x){return /^[A-D]-\d{4}$/.test(x)}):null;
  var all={},walls={},confirm=false;
  function list(){return sharedList||AM.picks.get()}
  function render(){
    var keys=list().filter(function(k){return all[k]});
    grid.innerHTML="";
    keys.forEach(function(k){var d=all[k],w=walls[d.wallId];grid.appendChild(AM.tile(k,d,w?AM.wallShort(w):d.wall))});
    count.textContent=keys.length?AM.TN("picks_n",keys.length):"";
    msg.hidden=keys.length>0;msg.textContent=sharedList?T("nothing"):T("picks_empty");
    acts.hidden=!keys.length;
    if(sharedList){sharedBox.hidden=false;sharedBox.textContent=T("picks_shared");saveAll.hidden=false;clearBtn.hidden=true;note.hidden=true}
    else{sharedBox.hidden=true;saveAll.hidden=true;clearBtn.hidden=false;note.hidden=false}
  }
  shareBtn.addEventListener("click",function(){
    var keys=list().filter(function(k){return all[k]});if(!keys.length)return;
    var url=location.origin+location.pathname+"?p="+keys.join(",");
    AM.share({title:T("picks_share_title"),text:T("picks_share_title")+": "+keys.map(function(k){return k+" "+AM.L(all[k],"title")+" ("+all[k].price+")"}).join("; "),url:url})});
  saveAll.addEventListener("click",function(){
    var cur=AM.picks.get();sharedList.forEach(function(k){if(all[k]&&cur.indexOf(k)<0)cur.push(k)});AM.picks.set(cur);
    sharedList=null;history.replaceState(null,"",location.pathname);render();AM.toast(T("picks_saved_all"))});
  clearBtn.addEventListener("click",function(){
    if(!confirm){confirm=true;clearBtn.textContent=T("picks_clear2");setTimeout(function(){confirm=false;clearBtn.textContent=T("picks_clear")},3000);return}
    AM.picks.set([]);confirm=false;clearBtn.textContent=T("picks_clear")});
  function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
  Promise.all([j("pieces.json"),j("walls.json").catch(function(){return {}})]).then(function(res){
    all=res[0];walls=res[1];render();
    /* when a heart is tapped here, the piece leaves the list */
    var last=AM.picks.get().length;setInterval(function(){var n=AM.picks.get().length;if(n!==last){last=n;if(!sharedList)render()}},300);
  }).catch(function(){msg.hidden=false;msg.textContent=T("load_fail")});
})();
</script>
</body>
</html>
