<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atomic Motors Art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecee; --card:#fff; --ink:#14202b; --muted:#5a6772; --line:#cdd3d8; --accent:#c41222; --accent-ink:#fff; --photo:#dde2e6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --card:#18222b; --ink:#eef1f3; --muted:#9aa7b2; --line:#2c3a46; --accent:#ff4a58; --accent-ink:#14202b; --photo:#223039; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.brand a{color:inherit;text-decoration:none}.brand b{color:var(--accent)}
.tn{display:flex;gap:14px}.tn a[aria-current="page"]{color:var(--ink);border-bottom:2px solid var(--accent)}
.brand a:focus-visible,.chips button:focus-visible,.item:focus-visible,#q:focus-visible,.shop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,8vw,34px);line-height:1.1}
.sub{margin:0;color:var(--muted)}
#q{width:100%;font:16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips button{flex:0 0 auto;font:600 14px var(--body);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:300px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.thumb{aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb span{color:var(--muted);font-size:13px}
.meta{padding:8px 10px 10px;border-top:1px solid var(--line)}
.meta .sku{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.05em;line-height:1.1}
.meta .t{font-size:14px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .w{font-size:12px;color:var(--muted);margin-top:2px}
.meta .p{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.scanbtn{display:block;text-align:center;text-decoration:none;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:12px}.scanbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.adm{display:block;text-align:center;text-decoration:none;font:600 15px var(--body);color:var(--ink);background:var(--card);border:1px dashed var(--muted);border-radius:4px;padding:10px}.adm small{color:var(--muted);font-weight:400}.adm:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.hs input{width:20px;height:20px;accent-color:var(--accent)}
.msg{padding:24px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:6px}
.shop{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px}
.foot{font-size:13px;color:var(--muted)}
</style>
<link rel="stylesheet" href="common.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c41222">
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="welcome.html"><b>Atomic</b> Motors</a><span class="tn"><a href="home.html" aria-current="page" data-i18n="nav_all"></a><a href="welcome.html#map" data-i18n="nav_map"></a><a href="picks.html"><span data-i18n="nav_picks"></span> <span id="pickCount"></span></a><select id="lang"></select></span></div>
  <a class="scanbtn" href="scan.html" data-i18n="nav_scan"></a>
  <a class="adm" href="print.html">Admin: print tags and wall signs <small>(demo only)</small></a>
  <h1 data-i18n="home_title"></h1>
  <p class="sub" id="count"></p>
  <input id="q" type="search" data-i18n-ph="search_ph" data-i18n-aria="search_aria" autocomplete="off">
  <div class="chips" id="chips" data-i18n-aria="filter_aria"></div>
  <label class="hs"><input type="checkbox" id="hs"> <span data-i18n="hide_sold"></span></label>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" hidden></div>
  <a class="shop" href="map.html" data-i18n="find_art_map"></a>
  <a class="shop" href="https://dratomics.com/" target="_blank" rel="noopener" data-i18n="shop"></a>
  <div class="foot" data-i18n="demo"></div>
</div>
<script src="common.js"></script>
<script>
(function(){
  function shrink(){var x=window.innerWidth;document.body.style.zoom=(x>0&&x<300)?(x/340):""}
  shrink();window.addEventListener("resize",shrink);
  var grid=document.getElementById("grid"),msg=document.getElementById("msg"),q=document.getElementById("q"),chips=document.getElementById("chips"),count=document.getElementById("count");
  var hs=document.getElementById("hs");hs.addEventListener("change",function(){render()});var wallSel=(new URLSearchParams(location.search).get("wall")||"").toLowerCase(),all={},walls={},keys=[];
  function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function render(){
    var term=q.value.trim().toLowerCase();
    var shown=keys.filter(function(k){
      var d=all[k];
      if(wallSel&&d.wallId!==wallSel)return false;
      if(hs.checked&&AM.statusKey(d)==="sold")return false;
      if(!term)return true;
      var w=walls[d.wallId]||{};
      return (k+" "+AM.L(d,"title")+" "+AM.L(d,"location")+" "+d.wall+" "+AM.wallName(w)+" "+AM.L(d,"medium")+" "+AM.L(d,"description")).toLowerCase().indexOf(term)>-1;
    });
    grid.innerHTML="";
    shown.forEach(function(k){var d=all[k],w=walls[d.wallId];grid.appendChild(AM.tile(k,d,w?AM.wallShort(w):d.wall))});
    count.textContent=AM.TN("pieces",shown.length)+(shown.length!==keys.length?" ("+AM.T("of_total",{n:shown.length,m:keys.length})+")":"");
    msg.hidden=shown.length>0;if(!shown.length)msg.textContent=AM.T("nothing");
  }
  function chip(label,id){
    var b=document.createElement("button");b.type="button";b.textContent=label;b.setAttribute("aria-pressed",String(wallSel===id));
    b.addEventListener("click",function(){wallSel=id;Array.prototype.forEach.call(chips.children,function(c){c.setAttribute("aria-pressed","false")});b.setAttribute("aria-pressed","true");render()});
    chips.appendChild(b);
  }
  Promise.all([j("pieces.json"),j("walls.json").catch(function(){return {}})]).then(function(res){
    all=res[0];walls=res[1];keys=Object.keys(all).sort();
    chip(AM.T("chip_all"),""); Object.keys(walls).forEach(function(id){if(walls[id].count)chip(AM.wallShort(walls[id])+" ("+walls[id].count+")",id)});
    if(wallSel&&!walls[wallSel])wallSel="";
    Array.prototype.forEach.call(chips.children,function(c,i){});
    q.addEventListener("input",render);render();
  }).catch(function(){msg.hidden=false;msg.textContent=AM.T("load_fail")});
})();
</script>
</body>
</html>
