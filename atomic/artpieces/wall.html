<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atomic Motors Art Wall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecee; --card:#fff; --ink:#14202b; --muted:#5a6772; --line:#cdd3d8; --accent:#c41222; --photo:#dde2e6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --card:#18222b; --ink:#eef1f3; --muted:#9aa7b2; --line:#2c3a46; --accent:#ff4a58; --photo:#223039; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 40px}
.wrap{max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.brand b{color:var(--accent)}
.brand a{color:inherit;text-decoration:none}.brand a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tn{display:flex;gap:14px}.tn a[aria-current="page"]{color:var(--ink);border-bottom:2px solid var(--accent)}

h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(24px,8vw,34px);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:300px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb span{color:var(--muted);font-size:13px}
.meta{padding:8px 10px 10px;border-top:1px solid var(--line)}
.meta .sku{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.05em;line-height:1.1}
.meta .t{font-size:14px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .p{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.msg{padding:24px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:6px}
.shop{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px}
.shop.map{color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;letter-spacing:0;text-transform:none}
.foot{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="home.html"><b>Atomic</b> Motors</a><span class="tn"><a href="home.html">All art</a><a href="map.html">Map</a></span></div>
  <h1 id="h">Art wall</h1>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" hidden></div>
  <a class="shop map" id="mapLink" href="map.html" hidden>Find this wall on the building map</a>
  <a class="shop" href="https://dratomics.com/" target="_blank" rel="noopener">Visit the gift shop</a>
  <div class="foot">Tap a piece to see its photos, size and price. Demo page with made-up details.</div>
</div>
<script>
(function(){
  var w=(new URLSearchParams(location.search).get("w")||"").trim().toLowerCase();
  var grid=document.getElementById("grid"),msg=document.getElementById("msg");
  function say(t){msg.textContent=t;msg.hidden=false}
  if(!w){say("Scan the QR code on a wall sign to see the art on that wall.");return}
  function shrink(){var x=window.innerWidth;document.body.style.zoom=(x>0&&x<300)?(x/340):""}
  shrink();window.addEventListener("resize",shrink);
  function j(u){return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()})}
  Promise.all([j("pieces.json"),j("walls.json").catch(function(){return {}})]).then(function(res){
    var all=res[0],walls=res[1];
    var keys=Object.keys(all).filter(function(k){return all[k].wallId===w}).sort();
    var info=walls[w];
    if(!keys.length&&!info){say("No wall found for this code. Ask at the gift shop.");return}
    var name=info?info.name:all[keys[0]].wall;
    document.getElementById("mapLink").href="map.html?w="+encodeURIComponent(w);document.getElementById("mapLink").hidden=false;
    if(!keys.length){document.getElementById("h").textContent=name;document.title=name+" | Atomic Motors Art";document.getElementById("sub").textContent="No art on this wall yet.";return}
    document.getElementById("h").textContent=name;
    document.title=name+" | Atomic Motors Art";
    document.getElementById("sub").textContent=keys.length+(keys.length===1?" piece":" pieces")+" on this wall";
    keys.forEach(function(k){
      var d=all[k],a=document.createElement("a");a.className="item";a.href="index.html?s="+encodeURIComponent(k);
      var t=document.createElement("div");t.className="thumb";
      var ph=(d.photos||[])[0];
      if(ph){var im=document.createElement("img");im.src=typeof ph==="string"?ph:ph.src;im.alt=d.title;im.loading="lazy";t.appendChild(im)}
      else{var sp=document.createElement("span");sp.textContent="Photo coming soon";t.appendChild(sp)}
      var m=document.createElement("div");m.className="meta";
      [["sku",k],["t",d.title],["p",d.price]].forEach(function(p){var e=document.createElement("div");e.className=p[0];e.textContent=p[1];m.appendChild(e)});
      a.appendChild(t);a.appendChild(m);grid.appendChild(a);
    });
  }).catch(function(){say("Could not load this wall. Try again, or ask at the gift shop.")});
})();
</script>
</body>
</html>
