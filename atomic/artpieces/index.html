<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Atomic Motors Art</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#e9ecee; --card:#fff; --ink:#14202b; --muted:#5a6772; --line:#cdd3d8; --accent:#c41222; --accent-ink:#fff; --photo:#dde2e6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f161c; --card:#18222b; --ink:#eef1f3; --muted:#9aa7b2; --line:#2c3a46; --accent:#ff4a58; --accent-ink:#14202b; --photo:#223039; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 40px}
.wrap{max-width:460px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card,.body,.sku,.price{min-width:0}
h1,p,dd{overflow-wrap:anywhere}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.brand b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}

/* photo carousel */
.photo{position:relative;background:var(--photo)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-height:75vh;aspect-ratio:4/5}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;min-width:0;height:100%}
.slide img{display:block;width:100%;height:100%;object-fit:contain}
.none{padding:60px 16px;color:var(--muted);text-align:center}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(20,32,43,.55);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.arrow.prev{left:8px}.arrow.next{right:8px}
.arrow[hidden]{display:none}
.arrow:focus-visible,.dots button:focus-visible,.buy:focus-visible,.shop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px}
.dots button{width:22px;height:22px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:rgba(20,32,43,.35);box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.dots button[aria-current="true"]::before{background:var(--accent)}
.cap{padding:6px 16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;gap:12px}

.sku{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.sku .code{font-family:var(--display);font-weight:700;font-size:clamp(26px,11vw,44px);line-height:1;letter-spacing:.04em;overflow-wrap:anywhere}
.sku .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.body{padding:16px;display:grid;gap:14px}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(20px,7vw,28px);line-height:1.1;text-wrap:balance}
.price{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:4px}
.price .amt{font-family:var(--display);font-weight:700;font-size:clamp(24px,9vw,34px);line-height:1;font-variant-numeric:tabular-nums}
.price .note{font-size:13px;text-align:right}
.buy{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);border:2px solid var(--ink);border-radius:4px;padding:10px}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px}
@media (max-width:300px){dl{grid-template-columns:minmax(0,1fr);gap:0}dd{margin-bottom:8px}}
dt{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
dd{margin:0;min-width:0}
p{margin:0}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 10px}
.msg{padding:24px 16px;text-align:center}
.shop{display:block;text-align:center;text-decoration:none;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px}
.foot{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.track{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span><b>Atomic</b> Motors</span><span>Art tag</span></div>
  <div class="card" id="card" hidden>
    <div class="photo" id="photoBox">
      <div class="track" id="track" tabindex="0" aria-label="Photos of this piece. Swipe left or right."></div>
      <button class="arrow prev" id="prev" type="button" aria-label="Previous photo" hidden>&#8249;</button>
      <button class="arrow next" id="next" type="button" aria-label="Next photo" hidden>&#8250;</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="cap" id="cap" hidden><span id="capText"></span><span id="capCount"></span></div>
    <div class="sku"><span class="code" id="sku"></span><span class="lbl">SKU</span></div>
    <div class="body">
      <h1 id="title"></h1>
      <div class="price"><span class="amt" id="price"></span><span class="note">Ask at the gift shop<br>to buy this piece</span></div>
      <a class="buy" id="buy" href="#" target="_blank" rel="noopener" hidden>Buy online</a>
      <dl>
        <dt>Building</dt><dd id="bldg"></dd>
        <dt>Location</dt><dd id="loc"></dd>
        <dt>Size</dt><dd id="size"></dd>
        <dt>Medium</dt><dd id="med"></dd>
      </dl>
      <p id="desc"></p>
      <div class="demo">Demo page. Prices and details are made-up samples to show the layout.</div>
    </div>
  </div>
  <div class="card msg" id="msg" hidden></div>
  <a class="shop" href="https://dratomics.com/" target="_blank" rel="noopener">Visit the gift shop</a>
  <div class="foot">Tell the gift shop the SKU above and they can find this piece.</div>
</div>
<script>
/* If the browser is zoomed so far that the layout is under 300px wide, shrink the page to fit. */
(function(){function fit(){var w=window.innerWidth;document.body.style.zoom=(w>0&&w<300)?(w/340):""}
fit();window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit)})();

(function(){
  var params=new URLSearchParams(location.search);
  var sku=(params.get("s")||"").trim().toUpperCase();
  var card=document.getElementById("card"), msg=document.getElementById("msg");
  function say(t){msg.textContent=t;msg.hidden=false;card.hidden=true}
  if(!sku){say("Scan the QR code on an art tag to see a piece.");return}

  function buildPhotos(list,title){
    var track=document.getElementById("track"),dots=document.getElementById("dots"),
        prev=document.getElementById("prev"),next=document.getElementById("next"),
        cap=document.getElementById("cap"),capText=document.getElementById("capText"),capCount=document.getElementById("capCount");
    if(!list.length){
      track.parentNode.replaceChild(Object.assign(document.createElement("div"),{className:"none",textContent:"Photo coming soon"}),track);
      dots.hidden=true;return;
    }
    list=list.map(function(p){return typeof p==="string"?{src:p,label:""}:p});
    list.forEach(function(p,i){
      var s=document.createElement("div");s.className="slide";
      var im=document.createElement("img");im.src=p.src;im.alt=title+(p.label?" ("+p.label.toLowerCase()+")":"");
      if(i>0)im.loading="lazy";
      if(i===0)im.addEventListener("load",function(){
        var r=im.naturalWidth/im.naturalHeight;r=Math.max(0.7,Math.min(1.6,r));track.style.aspectRatio=String(r)});
      s.appendChild(im);track.appendChild(s);
      if(list.length>1){
        var b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Photo "+(i+1)+" of "+list.length+(p.label?": "+p.label:""));
        b.addEventListener("click",function(){go(i)});dots.appendChild(b);
      }
    });
    var cur=0;
    function go(i){track.scrollTo({left:i*track.clientWidth})}
    function update(){
      var i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
      i=Math.max(0,Math.min(list.length-1,i));cur=i;
      Array.prototype.forEach.call(dots.children,function(b,j){if(j===i)b.setAttribute("aria-current","true");else b.removeAttribute("aria-current")});
      prev.hidden=i===0;next.hidden=i===list.length-1;
      capText.textContent=list[i].label||"";capCount.textContent=(i+1)+" / "+list.length;
    }
    if(list.length>1){
      cap.hidden=false;
      track.addEventListener("scroll",function(){window.requestAnimationFrame(update)});
      prev.addEventListener("click",function(){go(cur-1)});next.addEventListener("click",function(){go(cur+1)});
      track.addEventListener("keydown",function(e){if(e.key==="ArrowRight"){go(cur+1);e.preventDefault()}if(e.key==="ArrowLeft"){go(cur-1);e.preventDefault()}});
      window.addEventListener("resize",function(){track.scrollTo({left:cur*track.clientWidth,behavior:"auto"})});
      update();
    }
  }

  fetch("pieces.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){
    var d=all[sku];
    if(!d){say("No piece found for SKU "+sku+". Ask at the gift shop.");return}
    document.title=sku+" | Atomic Motors Art";
    document.getElementById("sku").textContent=sku;
    document.getElementById("title").textContent=d.title;
    document.getElementById("price").textContent=d.price;
    document.getElementById("bldg").textContent="Building "+d.building;
    document.getElementById("loc").textContent=d.location;
    document.getElementById("size").textContent=d.size;
    document.getElementById("med").textContent=d.medium;
    document.getElementById("desc").textContent=d.description;
    buildPhotos(d.photos||[],d.title);
    var buy=document.getElementById("buy"),link=d.shopify||"";
    if(/^https:\/\//.test(link)){buy.href=link;buy.hidden=false}
    card.hidden=false;
  }).catch(function(){say("Could not load this piece. Try again, or ask at the gift shop.")});
})();
</script>
</body>
</html>
